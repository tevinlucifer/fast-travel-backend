<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Lanka Rides Back Office</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root { --bg: #c8e6fe; --ink: #0b1437; --mut: #5b6785; --bl: #1565e0; --ln: #b9c0ff; --card: #fff; --nav: #f5f5f5; --th: #cdd2ff; --odd: #f5f7ff; --pill: #111; }
      [data-theme=dark] { --bg: #0b1220; --ink: #e8ecf8; --mut: #9aa6c4; --ln: #2f3b63; --card: #151e33; --nav: #141c2f; --th: #243056; --odd: #1a243c; --pill: #26325a; }
      [data-theme=dark] .cd, [data-theme=dark] .st, [data-theme=dark] .tw { box-shadow: none; }
      .tile.aqua { color: #0b1437; }
      [data-theme=dark] { color-scheme: dark; }
      input, select, textarea { color: var(--ink); }
      ::placeholder { color: var(--mut); opacity: .85; }
      option { background: var(--card); color: var(--ink); }
      .tsw {
        position: relative;
        width: 78px;
        height: 40px;
        border-radius: 24px;
        border: 1px solid #ffffffb0;
        cursor: pointer;
        flex: none;
        padding: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg,#f6f7fa,#c6c9d4 55%,#e8eaf0);
        box-shadow: inset 0 1px 1px #fff,inset 0 -2px 4px #0002,0 2px 8px #0003,0 0 14px #fff9;
        transition: box-shadow .25s,transform .15s;
      }
      .tsw:hover { box-shadow: inset 0 1px 1px #fff,inset 0 -2px 4px #0002,0 2px 8px #0003,0 0 24px #fff; }
      .tsw:active { transform: scale(.96); }
      .tsw .ti {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg,#707584,#2a2d37);
        box-shadow: inset 0 2px 3px #000b,0 1px 0 #fffc;
        color: #eef1fa;
      }
      .tsw svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .tsw .is { display: none; }
      [data-theme=dark] .tsw {
        border-color: #ffffff24;
        background: linear-gradient(135deg,#3b3f4d,#1b1e27 55%,#2c303c);
        box-shadow: inset 0 1px 1px #ffffff30,inset 0 -2px 4px #0009,0 2px 8px #0009,0 0 16px #5b7cfa66;
      }
      [data-theme=dark] .tsw:hover { box-shadow: inset 0 1px 1px #ffffff30,inset 0 -2px 4px #0009,0 2px 8px #0009,0 0 26px #7f9cff; }
      [data-theme=dark] .tsw .ti { background: linear-gradient(145deg,#0d0f15,#2a2e3a); color: #ffd36b; }
      [data-theme=dark] .tsw .is { display: block; }
      [data-theme=dark] .tsw .im { display: none; }
      .tsw.fx { position: fixed; top: 18px; right: 18px; z-index: 9; }
      .mo { position: fixed; inset: 0; background: #0009; display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
      .mb {
        background: var(--card);
        color: var(--ink);
        border-radius: 22px;
        padding: 26px;
        width: min(640px,100%);
        max-height: 92vh;
        overflow: auto;
        box-shadow: 0 20px 60px #0007;
      }
      .mb h3 { margin: 6px 0 12px; }
      .fg { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-bottom: 18px; }
      .fg label { font-size: 13px; font-weight: 600; display: flex; flex-direction: column; gap: 5px; }
      .fg label.w { grid-column: 1/-1; }
      .fg i { color: #e8484d; font-style: normal; }
      .fg label>input, .fg label>select { width: 100%; }
      .fg { align-items: end; }
      .ac { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
      #merr { color: #e8484d; font-size: 13px; margin-top: 10px; }
      .seg { display: flex; gap: 10px; }
      .seg label { flex: 1; }
      .seg input { display: none; }
      .seg span { display: block; text-align: center; padding: 10px; border: 1px solid var(--ln); border-radius: 30px; cursor: pointer; font-size: 14px; }
      .seg input:checked+span { color: #fff; border-color: transparent; }
      .seg.nb input:checked+span { background: var(--bl); }
      .stAvailable input:checked+span { background: #3dba54; }
      .stUnavailable input:checked+span { background: #e8484d; }
      .stOntrip input:checked+span { background: #e0a800; }
      .sb { display: inline-flex; gap: 4px; }
      .sb button { border: 1px solid var(--ln); background: transparent; color: var(--mut); border-radius: 20px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
      .sb button.on { color: #fff; border-color: transparent; }
      .sb button.on.Available { background: #3dba54; }
      .sb button.on.Unavailable { background: #e8484d; }
      .sb button.on.Ontrip { background: #e0a800; }
      @media(max-width:600px) {
        .fg { grid-template-columns: 1fr; }
        .seg { flex-direction: column; }
      }
      .sw { border: 0; border-radius: 20px; padding: 5px 14px; font-size: 12px; font-weight: 600; cursor: pointer; color: #fff; }
      .sw.on { background: #3dba54; }
      .sw.off { background: #e8484d; }
      .af { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
      .af input, .af select { width: auto; flex: 1; min-width: 150px; }
      * { box-sizing: border-box; margin: 0; font-family: Poppins,system-ui,sans-serif; }
      body { background: var(--bg); color: var(--ink); min-height: 100vh; }
      .hidden { display: none!important; }
      #login { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; background: var(--card); }
      .lp { background: #5b7cfa; position: relative; overflow: hidden; color: #fff; padding: 56px; }
      .lp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; mix-blend-mode: screen; opacity: .6; }
      .lp>* { position: relative; }
      .lp h2 { font-size: 44px; margin-top: 150px; line-height: 1.1; }
      .lp h2 span { font-weight: 400; }
      .logo { width: 48px; height: 48px; background: #e4e3df; color: #222; font: 700 20px Georgia,serif; display: grid; place-items: center; border-radius: 6px; }
      .lf { display: flex; flex-direction: column; justify-content: center; padding: 0 90px; }
      .lf h1 { color: #5b7cfa; font-size: 40px; }
      .lf label { font-weight: 600; font-size: 14px; margin: 18px 0 6px; }
      input, select { padding: 12px 18px; border: 1px solid var(--ln); border-radius: 30px; font-size: 14px; background: var(--card); width: 100%; }
      .btn { border: 0; border-radius: 30px; padding: 12px 22px; font-weight: 500; cursor: pointer; color: #fff; background: linear-gradient(#4a90ff,var(--bl)); font-size: 14px; }
      .btn.o { background: var(--card); color: var(--bl); border: 1px solid var(--ln); }
      .btn.g { background: #3dba54; }
      .btn.r { background: #e8484d; }
      .btn.s { padding: 6px 14px; font-size: 13px; }
      #err { color: #c62828; font-size: 13px; margin-top: 10px; }
      nav { margin: 26px 40px 0; background: var(--nav); border-radius: 40px; padding: 12px 22px; display: flex; align-items: center; gap: 10px; }
      nav b { font-size: 18px; margin: 0 auto 0 12px; }
      nav .logo { width: 40px; height: 40px; font-size: 16px; }
      nav a {
        background: var(--pill);
        color: #fff;
        border-radius: 30px;
        padding: 10px clamp(9px,1.05vw,20px);
        text-decoration: none;
        font-size: clamp(12px,.82vw + 1px,15px);
        white-space: nowrap;
      }
      nav a.on { background: linear-gradient(#4a90ff,var(--bl)); }
      nav span { font-size: 12px; color: var(--mut); margin-left: 18px; text-align: right; }
      nav span b { display: block; color: var(--ink); font-size: 14px; margin: 0; }
      main { padding: 20px 40px 50px; }
      h1.t { font-size: 30px; }
      .sub { color: var(--mut); font-size: 14px; margin: 2px 0 14px; }
      .hd { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
      .g { display: grid; gap: 16px; margin-bottom: 16px; }
      .g3 { grid-template-columns: repeat(3,1fr); }
      .g4 { grid-template-columns: repeat(4,1fr); }
      .g5 { grid-template-columns: repeat(5,1fr); }
      .st { background: var(--card); border-radius: 20px; padding: 16px 18px; box-shadow: 0 6px 18px #0a3a7a22; }
      .st small { color: var(--mut); font-size: 12px; display: block; }
      .st b { font-size: 24px; }
      .tile {
        display: block;
        color: #fff;
        text-decoration: none;
        border-radius: 22px;
        padding: 22px;
        min-height: 120px;
        background: linear-gradient(#0a56d8,#4a96ff);
        cursor: pointer;
      }
      .tile h3 { font-size: 24px; }
      .tile p { font-size: 13px; margin-top: 34px; opacity: .9; }
      .tile.green { background: linear-gradient(#2e9e41,#74d160); }
      .tile.red { background: linear-gradient(#cc3a40,#ee7075); }
      .tile.aqua { background: linear-gradient(135deg,#2db6dd,#e8f6ff); color: var(--ink); }
      .tile big { display: block; font-size: 44px; font-weight: 700; margin-top: 40px; }
      .cd { background: var(--card); border-radius: 20px; padding: 18px; box-shadow: 0 6px 18px #0a3a7a22; margin-bottom: 16px; }
      .cd h4 { margin-bottom: 8px; }
      .cd p { font-size: 14px; margin: 8px 0; }
      .tw { background: var(--card); border-radius: 20px; overflow: auto; box-shadow: 0 6px 18px #0a3a7a22; border: 2px solid var(--ln); }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { background: var(--th); padding: 12px 8px; }
      td { padding: 14px 8px; text-align: center; border: 1px solid var(--ln); }
      tbody tr:nth-child(odd) { background: var(--odd); }
      tr[data-go] { cursor: pointer; }
      .bd { border-radius: 20px; padding: 3px 12px; font-size: 12px; background: var(--card)3c4; color: #8a5a00; white-space: nowrap; }
      .bd.ok { background: #d9f4de; color: #1c7a2f; }
      .bd.no { background: #fde0e0; color: #b3262b; }
      .bd.in { background: #e1e8ff; color: #2750c8; }
      .bar { height: 12px; border-radius: 8px; background: linear-gradient(90deg,#2db6dd,#4a90ff); }
      .bars { display: flex; align-items: flex-end; gap: 16px; height: 200px; }
      .bars div { flex: 1; text-align: center; font-size: 12px; }
      .bars i { display: block; border-radius: 10px 10px 0 0; background: linear-gradient(#4a90ff,#0a56d8); }
      .two { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
      .row { display: flex; justify-content: space-between; gap: 10px; }
      .fl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .set label { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin: 10px 0; gap: 10px; }
      .set input { width: 110px; padding: 8px 12px; }
      @media(max-width:900px) {
        #login { grid-template-columns: 1fr; }
        .lp { display: none; }
        .lf { padding: 40px; }
        .g3, .g4, .g5, .two { grid-template-columns: 1fr 1fr; }
        nav { flex-wrap: wrap; margin: 12px; }
        main { padding: 16px; }
      }
      .hd>.fl { margin-bottom: 16px; }
      nav { flex-wrap: nowrap; row-gap: 8px; position: relative; z-index: 12; }
      .bkb {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid #d3d5dd;
        cursor: pointer;
        flex: none;
        padding: 0;
        display: grid;
        place-items: center;
        color: #6f7482;
        background: radial-gradient(circle at 50% 22%,#fff 0,#f4f4f7 55%,#d9dbe2 100%);
        box-shadow: 0 3px 10px #0003,inset 0 -5px 8px #ffffffd0;
        transition: transform .15s,opacity .2s;
      }
      .bkb svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .bkb:hover:not(:disabled) { transform: scale(1.07); }
      .bkb:disabled { opacity: .35; cursor: default; }
      [data-theme=dark] .bkb {
        border-color: #ffffff22;
        color: #dfe4f5;
        background: radial-gradient(circle at 50% 22%,#4a5066 0,#252a3a 55%,#12151f 100%);
        box-shadow: 0 3px 10px #0009,inset 0 -5px 8px #00000066;
      }
      #sbox { position: relative; flex: 0 1 180px; min-width: 130px; }
      .sbx { display: flex; align-items: center; border: 2px solid var(--ink); background: #e9e9ec; border-radius: 30px; padding: 2px 2px 2px 14px; }
      [data-theme=dark] .sbx { background: var(--odd); }
      .sbx input { border: 0; background: transparent; padding: 6px 6px; border-radius: 0; font-size: 13px; outline: 0; width: 100%; min-width: 0; color: var(--ink); }
      .sbx button {
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 0;
        background: var(--ink);
        color: var(--card);
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
      }
      .sbx svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
      #qr {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        width: max(100%,320px);
        max-height: 340px;
        overflow: auto;
        background: var(--card);
        border: 1px solid var(--ln);
        border-radius: 16px;
        box-shadow: 0 14px 40px #0004;
        z-index: 30;
      }
      .si { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--ln); text-align: left; }
      .si:last-child { border: 0; }
      .si:hover { background: var(--odd); }
      .si .k { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--bl); }
      .si .t1 { font-size: 14px; font-weight: 600; color: var(--ink); }
      .si .t2 { font-size: 12px; color: var(--mut); }
      #nv { flex-wrap: nowrap; min-width: 0; }
      nav>b { white-space: nowrap; }
      nav>span { white-space: nowrap; flex: none; margin-left: 6px; }
      nav>a#lo { flex: none; }
      @media(max-width:1280px) {
        nav>b { display: none; }
        #nv { margin-left: auto; }
      }
      @media(max-width:1000px) {
        nav { flex-wrap: wrap; }
      }
      /* ===== TravelPro-style redesign ===== */
      :root {
        --bg: #f1f5fb;
        --ink: #101a33;
        --mut: #6b7794;
        --bl: #2563eb;
        --ln: #e5eaf3;
        --card: #fff;
        --th: #f6f8fc;
        --odd: #fff;
        --side: #0b1f4d;
        --hov: #f3f6fd;
        --sh: 0 1px 3px #0f1f4a0f;
      }
      [data-theme=dark] {
        --bg: #0a1020;
        --ink: #e8ecf8;
        --mut: #93a0bf;
        --ln: #232e4d;
        --card: #121a30;
        --th: #18223c;
        --odd: #121a30;
        --side: #08132f;
        --hov: #18223c;
        --sh: none;
      }
      * { font-family: Inter,Poppins,system-ui,sans-serif; }
      #shell { display: flex; min-height: 100vh; }
      .side { width: 236px; flex: none; background: var(--side); color: #fff; padding: 22px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
      .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 26px; font-size: 19px; }
      .brand .logo { width: 34px; height: 34px; font-size: 14px; border-radius: 9px; background: var(--bl); color: #fff; font-family: inherit; }
      #nv { display: flex; flex-direction: column; gap: 4px; flex: 1; overflow: auto; }
      #nv a, .side .out {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 11px 14px;
        border-radius: 10px;
        color: #c5cfe8;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
      }
      .side svg, .ic svg, .ib svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
      #nv a:hover, .side .out:hover { background: #ffffff14; color: #fff; }
      #nv a.on { background: var(--bl); color: #fff; }
      .mn { flex: 1; min-width: 0; }
      .top { display: flex; align-items: center; gap: 12px; padding: 16px 32px; position: relative; z-index: 12; }
      .sp { flex: 1; }
      #sbox { flex: 1 1 auto; max-width: 440px; min-width: 150px; }
      .sbx { border: 1px solid var(--ln); background: var(--card); border-radius: 12px; padding: 3px 12px; box-shadow: var(--sh); }
      [data-theme=dark] .sbx { background: var(--card); }
      .sbx button { order: -1; background: none; color: var(--mut); width: 26px; height: 26px; }
      .sbx input { padding: 8px 8px; color: var(--ink); }
      #qr { left: 0; right: auto; width: max(100%,340px); border-radius: 12px; }
      [data-theme] .tsw, [data-theme] .bkb, .ib {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--ln);
        background: var(--card);
        box-shadow: var(--sh);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 0;
        position: relative;
        cursor: pointer;
        transition: none;
      }
      [data-theme] .tsw:hover, [data-theme] .bkb:hover:not(:disabled) { box-shadow: var(--sh); transform: none; background: var(--hov); }
      [data-theme] .tsw .ti { background: none; box-shadow: none; color: var(--ink); }
      [data-theme=dark] .tsw .ti { color: #ffd36b; }
      .tsw.fx { position: fixed; top: 18px; right: 18px; }
      .ib.dot::after { content: ""; position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; border: 2px solid var(--card); }
      .usr { display: flex; align-items: center; gap: 10px; margin-left: 6px; }
      .usr small { display: block; color: var(--mut); font-size: 12px; }
      .usr b { display: block; font-size: 14px; }
      #av {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--bl);
        color: #fff;
        display: grid;
        place-items: center;
        font: 600 15px Inter,sans-serif;
        font-style: normal;
      }
      main { padding: 6px 32px 40px; }
      h1.t { font-size: 22px; font-weight: 700; }
      .st, .cd, .tw { border-radius: 16px; box-shadow: var(--sh); border: 1px solid var(--ln); }
      .st { padding: 18px; }
      .st b { font-size: 24px; font-weight: 700; }
      .kp { display: flex; gap: 14px; align-items: center; color: inherit; text-decoration: none; }
      .kp small { font-size: 13px; }
      .kp em { display: block; font-style: normal; font-size: 12px; color: var(--mut); margin-top: 2px; }
      .ic { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; }
      .ic svg { width: 22px; height: 22px; }
      .ic.b { background: #2563eb1f; color: #2563eb; }
      .ic.g { background: #10b9811f; color: #059669; }
      .ic.p { background: #8b5cf61f; color: #7c3aed; }
      .ic.o { background: #f59e0b24; color: #d97706; }
      .hero {
        position: relative;
        overflow: hidden;
        border-radius: 16px;
        padding: 32px;
        min-height: 132px;

        background: linear-gradient(100deg,#0b2a6b,#1d5fd1 55%,#5fb7e8);
        margin-bottom: 16px;
      }
      .hero h2 { font-size: 22px; font-weight: 700; position: relative; }

      .hv { position: absolute; right: 0; bottom: 0; width: 50%; height: 100%; }
      .dg { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
      .dg>div>.cd:last-child { margin-bottom: 0; }
      .ch { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
      .ch h4 { font-size: 16px; margin: 0; }
      .ch a { font-size: 13px; color: var(--bl); text-decoration: none; font-weight: 500; }
      .rw { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--ln); color: inherit; text-decoration: none; }
      .rw:first-of-type { border-top: 0; }
      .rw .ic { width: 40px; height: 40px; }
      .rw .ic svg { width: 18px; height: 18px; }
      .rw>div { flex: 1; min-width: 0; }
      .rw b { font-size: 14px; display: block; }
      .rw small { font-size: 12px; color: var(--mut); }
      .rw .r2 { text-align: right; flex: none; }
      .rw .r2 span { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
      .ov { display: flex; align-items: center; gap: 26px; padding: 10px 4px; flex-wrap: wrap; }
      .dn { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; flex: none; }
      .dn>div { width: 98px; height: 98px; border-radius: 50%; background: var(--card); display: grid; place-content: center; text-align: center; }
      .dn b { font-size: 26px; line-height: 1; }
      .dn small { font-size: 12px; color: var(--mut); }
      .lg { flex: 1; min-width: 140px; }
      .lg p { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 14px; }
      .lg i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
      .lg span { margin-left: auto; font-weight: 600; }
      .tile {
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--ln);
        border-left: 5px solid var(--bl);
        border-radius: 16px;
        box-shadow: var(--sh);
        min-height: 110px;
