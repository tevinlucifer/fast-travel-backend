/* ===== Soft-blue dashboard theme (matches reference) ===== */
:root{--bg:#e8eefb;--card:#e1eafb;--ink:#0f1b3d;--mut:#5d6b8c;--bl:#2f6bf0;--ln:#cbd8f3;--th:#bdd0fa;--hov:#d3e1fc;--side:#e1eafb;--inp:#f3f6fe;--b1:#2b93cc;--b2:#0e4a97;--sh:8px 10px 22px #a3b7df80,-6px -6px 16px #ffffffb0}
[data-theme=dark]{--bg:#0a1226;--card:#121c38;--ink:#e8ecf8;--mut:#93a0bf;--ln:#243255;--th:#1b2a52;--hov:#1a2748;--side:#101a34;--inp:#0c1530;--b1:#13497f;--b2:#0a1f4d;--sh:8px 10px 22px #0007,-4px -4px 14px #ffffff08}
#shell{background:linear-gradient(110deg,var(--b1),var(--b2)) top/100% 190px no-repeat,var(--bg)}
.side{margin-top:50px;height:calc(100vh - 50px);top:50px;border-radius:28px 0 0 0;color:var(--ink);background:var(--side);box-shadow:var(--sh)}
.brand b{color:var(--ink)}
#nv a,.side .out{color:var(--mut)}
#nv a:hover,.side .out:hover{background:var(--hov);color:var(--ink)}
#nv a.on{background:var(--bl);color:#fff;box-shadow:0 8px 16px #2f6bf055}
/* header on the gradient banner */
.top .sbx{background:#ffffff14;border:1px solid #ffffffb0;border-radius:30px;box-shadow:none}
.top .sbx input{color:#fff;background:transparent;border:0}.top .sbx input::placeholder{color:#ffffffcc}
.top .sbx button{order:0;color:#fff}
.top .tsw,.top .bkb,.top .ib{background:#ffffff1a;border:1px solid #ffffffb0;color:#fff;box-shadow:none}
.top .tsw:hover,.top .bkb:hover:not(:disabled),.top .ib:hover{background:#ffffff33}
.top .tsw .ti{color:#fff}[data-theme=dark] .top .tsw .ti{color:#ffd36b}
.ib.dot::after{border-color:#2a74c0}
.usr b{color:#fff}.usr small{color:#ffffffb8}#av{background:#ffffff2e;border:1px solid #fff9}
.hd h1.t,.hero h2{color:#fff}.hd .sub{color:#ffffffd0}
.hero{background:none;box-shadow:none;border-radius:0;padding:8px 0 22px;min-height:0;margin-bottom:6px}.hv{display:none}
.hero p{color:#fff}
/* soft cards with coloured bottom band */
.cd,.tw,.rf,.mb{background:var(--card);border:0;border-radius:18px;box-shadow:var(--sh)}
.st,.tile,.tile.green,.tile.red,.tile.aqua{--c:var(--bl);border:0;border-radius:18px;box-shadow:var(--sh);color:var(--ink);background:var(--card) linear-gradient(var(--c),var(--c)) bottom/100% 8px no-repeat}
.st{padding-bottom:24px}
.kp:has(.ic.g),.tile.green{--c:#34d399}.kp:has(.ic.p){--c:#8b5cf6}.kp:has(.ic.o),.tile.aqua{--c:#f5a524}.tile.red{--c:#ef4444}
.st b,.tile big{color:var(--c)}
th{background:var(--th);color:var(--ink);text-transform:uppercase;letter-spacing:.03em}
tr.grp td{background:var(--th)}
input,select,textarea{background:var(--inp);border:1px solid var(--ln);border-radius:12px}
.btn{background:linear-gradient(#5b9bff,var(--bl));border-radius:12px;box-shadow:0 6px 14px #2f6bf044}
.btn.o{background:var(--card);border:0;box-shadow:var(--sh)}
.btn.g{background:linear-gradient(#4ade80,#10b981);box-shadow:none}.btn.r{background:linear-gradient(#f87171,#ef4444);box-shadow:none}
.rfp .btn.on{background:var(--bl);color:#fff}
.lp{background:linear-gradient(160deg,var(--b2),var(--b1))}
@media print{#shell{background:#fff}.hd h1.t,.hd .sub{color:#000}.st,.cd,.tw,.rf{box-shadow:none;border:1px solid #ccc}}

<script type="module">

async function api(p,o={}){const t=await auth.currentUser.getIdToken();const r=await fetch(API+'/api'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+t}});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.message||'Request failed');return d}

<div class="g g4">${kp('inbox','b','New requests',n,'Waiting for a decision','new')}${kp('check','g','Accepted trips',a.length,'Confirmed bookings','accepted')}${kp('cash','p','Revenue',LKR(rev),'From accepted bookings','analytics')}${kp('pct','o','Acceptance rate',rate+'%','Accepted vs rejected','analytics')}</div>

if(t.dataset.edu)return openUs(US.find(x=>x.id==t.dataset.edu));
if(t.dataset.rmu)return confirm('Remove this user?')&&api('/users/'+t.dataset.rmu,{method:'DELETE'}).then(load).catch(e=>alert(e.message));
if(t.dataset.cat){const c=t.dataset.cat,cats={Sedan:true,KDH:true,Hatchback:true,...(CFG.categories||{})};cats[c]=cats[c]===false;return api('/settings',{method:'POST',body:JSON.stringify({categories:cats})}).then(()=>{CFG.categories=cats;route()}).catch(e=>alert(e.message))}
if(t.id=='sv'){document.querySelectorAll('[data-k]').forEach(i=>CFG[i.dataset.k]=i.value);return api('/settings',{method:'POST',body:JSON.stringify(CFG)}).then(()=>alert('Saved')).catch(e=>alert(e.message))}
if(t.id=='ex'&&EXP){const c='\ufeff'+[EXP.head,...EXP.rows].map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv;charset=utf-8'}));a.download=EXP.name+'-'+(RF.from||'start')+'-to-'+(RF.to||'today')+'.csv';a.click();return}
const tr=t.closest('tr[data-go]');if(tr&&!t.closest('button'))location.hash=tr.dataset.go;
else if(t.closest('tr[data-go]')&&t.classList.contains('g'))location.hash=t.closest('tr').dataset.go});
$('#lf').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';try{await signInWithEmailAndPassword(auth,$('#em').value,$('#pw').value)}catch{$('#err').textContent='Invalid email or password.'}};
$('#fp').onclick=async e=>{e.preventDefault();if(!$('#em').value)return $('#err').textContent='Enter your email first.';await sendPasswordResetEmail(auth,$('#em').value).catch(()=>{});$('#err').style.color='#1c7a2f';$('#err').textContent='If the account exists, a reset email was sent.'};
$('#lo').onclick=e=>{e.preventDefault();signOut(auth)};
onAuthStateChanged(auth,u=>{$('#login').classList.toggle('hidden',!!u);document.querySelector('.tsw.fx').classList.toggle('hidden',!!u);$('#shell').classList.toggle('hidden',!u);if(u){STACK=[location.hash||'#dash'];syncBack();$('#un').textContent=u.displayName||u.email;$('#av').textContent=(u.displayName||u.email||'?')[0].toUpperCase();load();route()}});
setInterval(()=>auth.currentUser&&load(),10000);
