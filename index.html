<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lanka Rides Back Office</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#c8e6fe;--ink:#0b1437;--mut:#5b6785;--bl:#1565e0;--ln:#b9c0ff;--card:#fff;--nav:#f5f5f5;--th:#cdd2ff;--odd:#f5f7ff;--pill:#111}
[data-theme=dark]{--bg:#0b1220;--ink:#e8ecf8;--mut:#9aa6c4;--ln:#2f3b63;--card:#151e33;--nav:#141c2f;--th:#243056;--odd:#1a243c;--pill:#26325a}
[data-theme=dark] .cd,[data-theme=dark] .st,[data-theme=dark] .tw{box-shadow:none}
.tile.aqua{color:#0b1437}[data-theme=dark]{color-scheme:dark}input,select,textarea{color:var(--ink)}::placeholder{color:var(--mut);opacity:.85}option{background:var(--card);color:var(--ink)}
.tsw{position:relative;width:78px;height:40px;border-radius:24px;border:1px solid #ffffffb0;cursor:pointer;flex:none;padding:0;display:grid;place-items:center;background:linear-gradient(135deg,#f6f7fa,#c6c9d4 55%,#e8eaf0);box-shadow:inset 0 1px 1px #fff,inset 0 -2px 4px #0002,0 2px 8px #0003,0 0 14px #fff9;transition:box-shadow .25s,transform .15s}
.tsw:hover{box-shadow:inset 0 1px 1px #fff,inset 0 -2px 4px #0002,0 2px 8px #0003,0 0 24px #fff}.tsw:active{transform:scale(.96)}
.tsw .ti{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#707584,#2a2d37);box-shadow:inset 0 2px 3px #000b,0 1px 0 #fffc;color:#eef1fa}
.tsw svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tsw .is{display:none}
[data-theme=dark] .tsw{border-color:#ffffff24;background:linear-gradient(135deg,#3b3f4d,#1b1e27 55%,#2c303c);box-shadow:inset 0 1px 1px #ffffff30,inset 0 -2px 4px #0009,0 2px 8px #0009,0 0 16px #5b7cfa66}
[data-theme=dark] .tsw:hover{box-shadow:inset 0 1px 1px #ffffff30,inset 0 -2px 4px #0009,0 2px 8px #0009,0 0 26px #7f9cff}
[data-theme=dark] .tsw .ti{background:linear-gradient(145deg,#0d0f15,#2a2e3a);color:#ffd36b}[data-theme=dark] .tsw .is{display:block}[data-theme=dark] .tsw .im{display:none}
.tsw.fx{position:fixed;top:18px;right:18px;z-index:9}
.mo{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.mb{background:var(--card);color:var(--ink);border-radius:22px;padding:26px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px #0007}
.mb h3{margin:6px 0 12px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-bottom:18px}.fg label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:5px}.fg label.w{grid-column:1/-1}.fg i{color:#e8484d;font-style:normal}.fg label>input,.fg label>select{width:100%}.fg{align-items:end}
.ac{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}#merr{color:#e8484d;font-size:13px;margin-top:10px}
.seg{display:flex;gap:10px}.seg label{flex:1}.seg input{display:none}.seg span{display:block;text-align:center;padding:10px;border:1px solid var(--ln);border-radius:30px;cursor:pointer;font-size:14px}
.seg input:checked+span{color:#fff;border-color:transparent}.stAvailable input:checked+span{background:#3dba54}.stUnavailable input:checked+span{background:#e8484d}.stOntrip input:checked+span{background:#e0a800}
.sb{display:inline-flex;gap:4px}.sb button{border:1px solid var(--ln);background:transparent;color:var(--mut);border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer}
.sb button.on{color:#fff;border-color:transparent}.sb button.on.Available{background:#3dba54}.sb button.on.Unavailable{background:#e8484d}.sb button.on.Ontrip{background:#e0a800}
@media(max-width:600px){.fg{grid-template-columns:1fr}.seg{flex-direction:column}}
.sw{border:0;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;color:#fff}.sw.on{background:#3dba54}.sw.off{background:#e8484d}
.af{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.af input,.af select{width:auto;flex:1;min-width:150px}
*{box-sizing:border-box;margin:0;font-family:Poppins,system-ui,sans-serif}
body{background:var(--bg);color:var(--ink);min-height:100vh}.hidden{display:none!important}
#login{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;background:var(--card)}
.lp{background:#5b7cfa;position:relative;overflow:hidden;color:#fff;padding:56px}
.lp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:screen;opacity:.6}
.lp>*{position:relative}.lp h2{font-size:44px;margin-top:150px;line-height:1.1}.lp h2 span{font-weight:400}
.logo{width:48px;height:48px;background:#e4e3df;color:#222;font:700 20px Georgia,serif;display:grid;place-items:center;border-radius:6px}
.lf{display:flex;flex-direction:column;justify-content:center;padding:0 90px}.lf h1{color:#5b7cfa;font-size:40px}
.lf label{font-weight:600;font-size:14px;margin:18px 0 6px}
input,select{padding:12px 18px;border:1px solid var(--ln);border-radius:30px;font-size:14px;background:var(--card);width:100%}
.btn{border:0;border-radius:30px;padding:12px 22px;font-weight:500;cursor:pointer;color:#fff;background:linear-gradient(#4a90ff,var(--bl));font-size:14px}
.btn.o{background:var(--card);color:var(--bl);border:1px solid var(--ln)}.btn.g{background:#3dba54}.btn.r{background:#e8484d}.btn.s{padding:6px 14px;font-size:13px}
#err{color:#c62828;font-size:13px;margin-top:10px}
nav{margin:26px 40px 0;background:var(--nav);border-radius:40px;padding:12px 22px;display:flex;align-items:center;gap:10px}
nav b{font-size:18px;margin:0 auto 0 12px}nav .logo{width:40px;height:40px;font-size:16px}
nav a{background:var(--pill);color:#fff;border-radius:30px;padding:10px 24px;text-decoration:none;font-size:15px}
nav a.on{background:linear-gradient(#4a90ff,var(--bl))}nav span{font-size:12px;color:var(--mut);margin-left:18px;text-align:right}
nav span b{display:block;color:var(--ink);font-size:14px;margin:0}
main{padding:20px 40px 50px}h1.t{font-size:30px}.sub{color:var(--mut);font-size:14px;margin:2px 0 14px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.g{display:grid;gap:16px;margin-bottom:16px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.st{background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:0 6px 18px #0a3a7a22}.st small{color:var(--mut);font-size:12px;display:block}.st b{font-size:24px}
.tile{display:block;color:#fff;text-decoration:none;border-radius:22px;padding:22px;min-height:120px;background:linear-gradient(#0a56d8,#4a96ff);cursor:pointer}
.tile h3{font-size:24px}.tile p{font-size:13px;margin-top:34px;opacity:.9}.tile.green{background:linear-gradient(#2e9e41,#74d160)}.tile.red{background:linear-gradient(#cc3a40,#ee7075)}
.tile.aqua{background:linear-gradient(135deg,#2db6dd,#e8f6ff);color:var(--ink)}.tile big{display:block;font-size:44px;font-weight:700;margin-top:40px}
.cd{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 6px 18px #0a3a7a22;margin-bottom:16px}.cd h4{margin-bottom:8px}.cd p{font-size:14px;margin:8px 0}
.tw{background:var(--card);border-radius:20px;overflow:auto;box-shadow:0 6px 18px #0a3a7a22;border:2px solid var(--ln)}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--th);padding:12px 8px}td{padding:14px 8px;text-align:center;border:1px solid var(--ln)}
tbody tr:nth-child(odd){background:var(--odd)}tr[data-go]{cursor:pointer}
.bd{border-radius:20px;padding:3px 12px;font-size:12px;background:var(--card)3c4;color:#8a5a00;white-space:nowrap}
.bd.ok{background:#d9f4de;color:#1c7a2f}.bd.no{background:#fde0e0;color:#b3262b}.bd.in{background:#e1e8ff;color:#2750c8}
.bar{height:12px;border-radius:8px;background:linear-gradient(90deg,#2db6dd,#4a90ff)}.bars{display:flex;align-items:flex-end;gap:16px;height:200px}
.bars div{flex:1;text-align:center;font-size:12px}.bars i{display:block;border-radius:10px 10px 0 0;background:linear-gradient(#4a90ff,#0a56d8)}
.two{display:grid;grid-template-columns:2fr 1fr;gap:16px}.row{display:flex;justify-content:space-between;gap:10px}.fl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.set label{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin:10px 0;gap:10px}.set input{width:110px;padding:8px 12px}
@media(max-width:900px){#login{grid-template-columns:1fr}.lp{display:none}.lf{padding:40px}.g3,.g4,.g5,.two{grid-template-columns:1fr 1fr}nav{flex-wrap:wrap;margin:12px}main{padding:16px}}

.hd>.fl{margin-bottom:16px}
nav{flex-wrap:wrap;row-gap:8px;position:relative;z-index:12}
.bkb{width:40px;height:40px;border-radius:50%;border:1px solid #d3d5dd;cursor:pointer;flex:none;padding:0;display:grid;place-items:center;color:#6f7482;background:radial-gradient(circle at 50% 22%,#fff 0,#f4f4f7 55%,#d9dbe2 100%);box-shadow:0 3px 10px #0003,inset 0 -5px 8px #ffffffd0;transition:transform .15s,opacity .2s}
.bkb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.bkb:hover:not(:disabled){transform:scale(1.07)}.bkb:disabled{opacity:.35;cursor:default}
[data-theme=dark] .bkb{border-color:#ffffff22;color:#dfe4f5;background:radial-gradient(circle at 50% 22%,#4a5066 0,#252a3a 55%,#12151f 100%);box-shadow:0 3px 10px #0009,inset 0 -5px 8px #00000066}
#sbox{position:relative;flex:0 1 210px;min-width:130px}
.sbx{display:flex;align-items:center;border:2px solid var(--ink);background:#e9e9ec;border-radius:30px;padding:2px 2px 2px 14px}
[data-theme=dark] .sbx{background:var(--odd)}
.sbx input{border:0;background:transparent;padding:6px 6px;border-radius:0;font-size:13px;outline:0;width:100%;min-width:0;color:var(--ink)}
.sbx button{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--ink);color:var(--card);display:grid;place-items:center;cursor:pointer;padding:0}
.sbx svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
#qr{position:absolute;top:calc(100% + 8px);right:0;width:max(100%,320px);max-height:340px;overflow:auto;background:var(--card);border:1px solid var(--ln);border-radius:16px;box-shadow:0 14px 40px #0004;z-index:30}
.si{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--ln);text-align:left}.si:last-child{border:0}.si:hover{background:var(--odd)}
.si .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--bl)}.si .t1{font-size:14px;font-weight:600;color:var(--ink)}.si .t2{font-size:12px;color:var(--mut)}
</style></head><body>
<button class="tsw fx" aria-label="Switch light / dark mode" title="Light / dark mode"><span class="ti"><svg class="im" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="is" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span></button>
<section id="login"><div class="lp"><div class="logo">TD</div><img src="images/hero-car.jpg" alt="">
<p style="margin-top:130px">Lanka Rides back office</p><h2><b>Secure access.</b><br><span>Smarter control.</span></h2></div>
<form class="lf" id="lf"><h1>Welcome back</h1><p class="sub">Sign in to manage bookings, fleet and payments.</p>
<label>Email address</label><input id="em" type="email" placeholder="you@lankarides.com" required>
<label>Password</label><input id="pw" type="password" required>
<div class="row" style="margin:14px 0 20px;font-size:13px"><span></span><a href="#" id="fp" style="color:#5b7cfa;text-decoration:none">Forgot password?</a></div>
<button class="btn" style="background:#5b7cfa;padding:16px">Log in</button><div id="err"></div>
<p class="sub" style="text-align:center;margin-top:30px">Powered by TD World</p></form></section>
<section id="shell" class="hidden"><nav><button id="bk" class="bkb" aria-label="Go back" title="Back" disabled><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="logo">TD</div><b>LANKA-RIDES</b><div id="nv" class="fl"></div><div id="sbox"><div class="sbx"><input id="q" placeholder="Search bookings, drivers…" autocomplete="off" aria-label="Search"><button type="button" id="qb" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button></div><div id="qr" class="hidden"></div></div><button class="tsw" aria-label="Switch light / dark mode" title="Light / dark mode"><span class="ti"><svg class="im" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="is" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span></button><span>Hello!<b id="un"></b></span><a href="#" id="lo" style="background:#e8484d;padding:8px 16px;font-size:13px">Log out</a></nav><main id="app"></main></section>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
const auth=getAuth(initializeApp({apiKey:"AIzaSyAHaToGc7F2vlQt6bDXRMMHjnqRf4OANfc",authDomain:"tlucifer-auth.firebaseapp.com",projectId:"tlucifer-auth"}));
const setTheme=t=>{document.documentElement.dataset.theme=t;localStorage.setItem("theme",t);document.querySelectorAll(".tsw").forEach(b=>b.setAttribute("aria-checked",t=="dark"))};
setTheme(localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
document.querySelectorAll(".tsw").forEach(b=>b.onclick=()=>setTheme(document.documentElement.dataset.theme=="dark"?"light":"dark"));
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LKR=n=>n?'LKR '+Number(n).toLocaleString():'—';
// When opened with Live Server / file://, talk to the Node server on port 3000
const API=(['5500','5501'].includes(location.port)||location.protocol==='file:')?'http://localhost:3000':'';
let BK=[],CFG={minNotice:3,maxDuration:14,buffer:30,grace:15,rateSedan:120,rateKDH:280,rateHatch:95};
let FLEET=[],DR=[]; // loaded from the server
const USERS=[['Tevin Gampalage','tevin@lankarides.com','Owner','Active'],['Jack Rowe','jack@lankarides.com','Dispatcher','Active'],['Kasun Silva','kasun@lankarides.com','Driver','Active'],['Dilini Fernando','dilini@lankarides.com','Accountant','Active']];
async function api(p,o={}){const t=await auth.currentUser.getIdToken();const r=await fetch(API+'/api'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+t}});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.message||'Request failed');return d}
async function load(){try{[BK,DR,FLEET]=(await Promise.all([api('/bookings'),api('/drivers'),api('/fleet')])).map((r,i)=>r.bookings||r.drivers||r.fleet);const s=await(await fetch(API+'/api/settings')).json();Object.assign(CFG,s.settings||{});route(true)}catch(e){console.warn(e)}}
const T=(h,r)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r||`<tr><td colspan="${h.length}">Nothing here yet</td></tr>`}</tbody></table></div>`;
const bd=(t,c='')=>`<span class="bd ${c}">${E(t)}</span>`,when=b=>E(b.date+' · '+b.time);
const by=s=>BK.filter(b=>b.status===s);
const head=(t,s,x='')=>`<div class="hd"><div><h1 class="t">${t}</h1><p class="sub">${s}</p></div><div class="fl">${x}</div></div>`;
const tile=(h,p,l,c='')=>`<a class="tile ${c}" href="#${l}"><h3>${h}</h3><p>${p}</p></a>`;
const V={
dash(){const n=by('New').length,a=by('Accepted'),rej=by('Rejected').length,rev=a.reduce((s,b)=>s+(+b.fare||0),0),free=FLEET.length,dOn=DR.filter(d=>d.status=='Available').length;
return head('Dashboard','Monitor your business performance in real time')+`<div class="g g5"><div class="st"><small>New requests</small><b>${n}</b></div><div class="st"><small>Accepted</small><b>${a.length}</b></div><div class="st"><small>Revenue (accepted)</small><b>${LKR(rev)}</b></div><div class="st"><small>Acceptance rate</small><b>${a.length+rej?Math.round(100*a.length/(a.length+rej)):0}%</b></div><div class="st"><small>Vehicles · Drivers available</small><b>${free} · ${dOn}/${DR.length}</b></div></div>
<div class="g g4">${tile('Bookings',n+' new','bookings')}${tile('Fleet',FLEET.length+' vehicles','fleet')}${tile('Payments',LKR(rev),'reports')}${tile('Reports','Booking report','reports')}${tile('Analytics','Trends and revenue','analytics')}${tile('Drivers',dOn+' of '+DR.length+' available','drivers')}${tile('Users',USERS.length+' accounts','users')}${tile('Settings','Rules and rates','settings')}</div>`},
bookings(){const old=by('New').filter(b=>Date.now()-new Date(b.createdAt)>2*36e5);
return head('Bookings','Review requests from the website and manage confirmed trips')+`<div class="g g3">${tile('New requests','<big>'+by('New').length+'</big>','new')}${tile('Accepted','<big>'+by('Accepted').length+'</big>','accepted','green')}${tile('Rejected','<big>'+by('Rejected').length+'</big>','rejected','red')}</div><div class="cd"><h4>Needs attention</h4>${old.map(b=>`<p>${bd('Waiting 2h+')} ${E(b.id)} ${E(b.name)} · ${E(b.pickup)} to ${E(b.dropoff)}</p>`).join('')||'<p>Nothing waiting.</p>'}</div>`},
new(){return head('New requests',by('New').length+' waiting for a decision')+T(['Booking ID','Customer','Mobile','From','To','Type','Vehicle','Pickup','Fare','Action'],by('New').map(b=>`<tr data-go="booking/${E(b.id)}"><td>${E(b.id)}</td><td>${E(b.name)}</td><td>${E(b.phone)}</td><td>${E(b.pickup)}</td><td>${E(b.dropoff)}</td><td>${E(b.type||'—')}</td><td>${E(b.vehicle||'—')}</td><td>${when(b)}</td><td>${LKR(b.fare)}</td><td><button class="btn g s">Accept</button> <button class="btn r s" data-dec="${E(b.id)}">Decline</button></td></tr>`).join(''))},
accepted(){return head('Accepted requests',by('Accepted').length+' confirmed trips')+T(['Booking ID','Customer','From','To','Vehicle','Pickup','Driver','Status'],by('Accepted').map(b=>`<tr data-go="booking/${E(b.id)}"><td>${E(b.id)}</td><td>${E(b.name)}</td><td>${E(b.pickup)}</td><td>${E(b.dropoff)}</td><td>${E(b.vehicle||'—')}</td><td>${when(b)}</td><td>${E(b.driver||'Not assigned')}</td><td>${b.driver?bd('Confirmed','ok'):bd('Assign driver')}</td></tr>`).join(''))},
rejected(){return head('Rejected requests',by('Rejected').length+' declined')+T(['Booking ID','Customer','Mobile','From','To','Vehicle','Reason','Customer notified'],by('Rejected').map(b=>`<tr><td>${E(b.id)}</td><td>${E(b.name)}</td><td>${E(b.phone)}</td><td>${E(b.pickup)}</td><td>${E(b.dropoff)}</td><td>${E(b.vehicle||'—')}</td><td>${bd(b.reason||'—','no')}</td><td>Email sent</td></tr>`).join(''))},
booking(id){const b=BK.find(x=>x.id==id);if(!b)return head('Not found','');const op=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${E(x)}</option>`).join('');
return head('Booking '+E(b.id),bd(b.status,b.status=='Accepted'?'ok':b.status=='Rejected'?'no':'')+' Received '+new Date(b.createdAt).toLocaleString()+' via website')+`<div class="two"><div class="cd"><h4>Trip</h4><p>${E(b.pickup)} → ${E(b.dropoff)} · ${when(b)}</p><p>Passengers ${E(b.passengers)} · Nationality ${E(b.nationality)}</p><p>Special request: ${E(b.requests||'none')}</p><hr><h4 style="margin-top:12px">Customer</h4><p>${E(b.name)} · ${E(b.phone)} · ${E(b.email)}</p><hr><h4 style="margin-top:12px">Fare</h4><div class="row"><p>${E(b.vehicle||b.type||'Vehicle not chosen')}</p><b>${LKR(b.fare)}</b></div></div>
<div class="cd"><h4>Assign</h4><select id="dr"><option value="">Driver…</option>${op(DR.filter(d=>d.status=='Available'||d.name==b.driver).map(d=>d.name),b.driver)}</select><br><br><select id="ve"><option value="">Vehicle…</option>${op(FLEET.map(f=>f.name+' · '+f.plate),b.vehicle)}</select><br><br><button class="btn g" style="width:100%" data-acc="${E(b.id)}">Accept and notify</button><br><br><button class="btn r" style="width:100%" data-dec="${E(b.id)}">Decline with reason</button></div></div>`},
fleet(){return head('Fleet',FLEET.length+' vehicles')+`<div class="af"><input id="vn" placeholder="Vehicle (e.g. Toyota Prius)"><select id="vt"><option>Sedan</option><option>KDH</option><option>Hatchback</option></select><input id="vp" placeholder="Plate number"><button class="btn" id="addVe">Add vehicle</button></div>`+T(['Vehicle','Type','Plate','Action'],FLEET.map(f=>`<tr><td>${E(f.name)}</td><td>${E(f.type)}</td><td>${E(f.plate)}</td><td><button class="btn r s" data-rmv="${E(f.id)}">Remove</button></td></tr>`).join(''))},
drivers(){const c=s=>DR.filter(d=>d.status==s).length;return head('Drivers',DR.length+' registered · '+c('Available')+' available · '+c('Unavailable')+' unavailable · '+c('On trip')+' on trip','<button class="btn" id="addDr">+ Add driver</button>')+T(['Name','Phone','City','Licence','Availability','Since','Action'],DR.map(d=>`<tr><td>${E(d.name)}</td><td>${E(d.phone)}</td><td>${E(d.city||'—')}</td><td>${E(d.license||'—')}</td><td><div class="sb">${['Available','Unavailable','On trip'].map(s=>`<button class="${s.replace(' ','')} ${d.status==s?'on':''}" data-st="${s}" data-id="${E(d.id)}">${s}</button>`).join('')}</div></td><td>${new Date(d.updatedAt).toLocaleString()}</td><td><button class="btn o s" data-edd="${E(d.id)}">Edit</button> <button class="btn r s" data-rmd="${E(d.id)}">Remove</button></td></tr>`).join(''))},
reports(){return head('Reports','Choose a report, set a date range, then print or export')+`<div class="g g4">${tile('Booking report','Open ›','report','aqua')}${['Sales report','Payment mode summary','Cash and flow','Refund report','Driver report','Vehicle utilisation','Customer report'].map(x=>`<a class="tile aqua" onclick="alert('${x}: coming soon')"><h3>${x}</h3><p>Open ›</p></a>`).join('')}</div>`},
report(){const c=s=>by(s).length;return head('Booking report','All website bookings',`<button class="btn o" onclick="print()">Print</button><button class="btn" id="ex">Export</button>`)+`<div class="g g5">${[['Total bookings',BK.length],['Accepted',c('Accepted')],['Rejected',c('Rejected')],['Cancelled',c('Cancelled')],['Completed',c('Completed')]].map(x=>`<div class="st"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>`+T(['Booking ID','Customer','Mobile','From','To','Vehicle','Pickup','Status'],BK.map(b=>`<tr><td>${E(b.id)}</td><td>${E(b.name)}</td><td>${E(b.phone)}</td><td>${E(b.pickup)}</td><td>${E(b.dropoff)}</td><td>${E(b.vehicle||'—')}</td><td>${when(b)}</td><td>${bd(b.status,b.status=='Accepted'||b.status=='Completed'?'ok':b.status=='Rejected'?'no':'')}</td></tr>`).join(''))},
analytics(){const m={};BK.forEach(b=>{const k=b.createdAt.slice(0,7);m[k]=(m[k]||0)+1});const ks=Object.keys(m).sort().slice(-6),mx=Math.max(1,...ks.map(k=>m[k])),d={};BK.forEach(b=>d[b.dropoff]=(d[b.dropoff]||0)+1);const td=Object.entries(d).sort((a,b)=>b[1]-a[1]).slice(0,5);
return head('Analytics','Bookings from the website')+`<div class="g g4"><div class="st"><small>Bookings</small><b>${BK.length}</b></div><div class="st"><small>Revenue (accepted)</small><b>${LKR(by('Accepted').reduce((s,b)=>s+(+b.fare||0),0))}</b></div></div><div class="two"><div class="cd"><h4>Bookings per month</h4><div class="bars">${ks.map(k=>`<div><i style="height:${m[k]/mx*170}px"></i>${k.slice(5)}/${k.slice(2,4)} (${m[k]})</div>`).join('')||'No data yet'}</div></div><div class="cd"><h4>Top destinations</h4>${td.map(x=>`<p>${E(x[0])}<div class="bar" style="width:${x[1]/td[0][1]*100}%"></div></p>`).join('')}</div></div>`},
settings(){const f=(k,l,u)=>`<label>${l}<input data-k="${k}" value="${E(CFG[k])}"></label>`;
return head('Settings','Rules the website and back office follow',`<a class="btn o" href="#users" style="text-decoration:none">Users and roles</a><button class="btn" id="sv">Save changes</button>`)+`<div class="g g3 set"><div class="cd"><h4>Booking rules</h4>${f('minNotice','Minimum notice (hrs)')}${f('maxDuration','Maximum duration (days)')}${f('buffer','Buffer between trips (min)')}${f('grace','No-show grace (min)')}</div><div class="cd"><h4>Rates (LKR per km)</h4>${f('rateSedan','Sedan')}${f('rateKDH','KDH')}${f('rateHatch','Hatch')}<h4 style="margin-top:14px">Cancellation policy</h4><p>48 hrs or more ${bd('Free','ok')}</p><p>24 to 48 hrs ${bd('25% fee')}</p><p>Under 24 hrs ${bd('50% fee','no')}</p></div><div class="cd"><h4>Vehicle categories</h4><p class="sub">Applies instantly. Disabled categories show as unavailable on the website.</p>${['Sedan','KDH','Hatchback'].map(c=>{const on=(CFG.categories||{})[c]!==false;return `<div class="row" style="align-items:center;margin:12px 0"><span>${c}</span><button class="sw ${on?'on':'off'}" data-cat="${c}">${on?'Enabled':'Disabled'}</button></div>`}).join('')}</div></div>`},
users(){return head('Users and roles',USERS.length+' accounts (demo data)')+T(['Name','Email','Role','Status'],USERS.map(u=>`<tr><td>${u[0]}</td><td>${u[1]}</td><td>${bd(u[2],'in')}</td><td>${bd(u[3],'ok')}</td></tr>`).join(''))}};
const NAV=[['Dashboard','dash'],['Bookings','bookings'],['Fleet','fleet'],['Drivers','drivers'],['Reports','reports'],['Settings','settings']],GRP={new:'bookings',accepted:'bookings',rejected:'bookings',booking:'bookings',report:'reports',users:'settings',analytics:'dash'};
function route(soft){if(!auth.currentUser)return;if(soft&&[...document.querySelectorAll('#app input,#app select')].some(i=>i.value!==i.defaultValue))return;let[r,a]=(location.hash.slice(1)||'dash').split('/');if(!V[r])r='dash';const on=GRP[r]||r;
$('#nv').innerHTML=NAV.map(n=>`<a href="#${n[1]}" class="${n[1]==on?'on':''}">${n[0]}</a>`).join('');$('#app').innerHTML=V[r](a)}
let STACK=[];
const syncBack=()=>{$('#bk').disabled=STACK.length<2};
addEventListener('hashchange',()=>{const h=location.hash||'#dash';if(STACK[STACK.length-2]===h)STACK.pop();else if(STACK[STACK.length-1]!==h)STACK.push(h);syncBack();route()});
$('#bk').onclick=()=>history.back();
// Search: bookings, drivers and vehicles
function doSearch(){const q=$('#q').value.trim().toLowerCase(),box=$('#qr');if(!q){box.classList.add('hidden');return}
const hit=(o,ks)=>ks.some(k=>String(o[k]||'').toLowerCase().includes(q)),r=[];
BK.filter(b=>hit(b,['id','name','phone','email','pickup','dropoff','status'])).slice(0,6).forEach(b=>r.push(['Booking',b.id+' · '+b.name,b.pickup+' → '+b.dropoff+' · '+b.status,'booking/'+b.id]));
DR.filter(d=>hit(d,['name','phone','city','license','nic','email','status'])).slice(0,5).forEach(d=>r.push(['Driver',d.name,d.phone+(d.city?' · '+d.city:'')+' · '+d.status,'drivers']));
FLEET.filter(f=>hit(f,['name','plate','type'])).slice(0,5).forEach(f=>r.push(['Vehicle',f.name,f.type+' · '+f.plate,'fleet']));
box.innerHTML=r.length?r.map(x=>`<div class="si" data-sgo="${E(x[3])}"><div class="k">${x[0]}</div><div class="t1">${E(x[1])}</div><div class="t2">${E(x[2])}</div></div>`).join(''):'<div class="si"><div class="t2">No results</div></div>';box.classList.remove('hidden')}
$('#q').addEventListener('input',doSearch);$('#q').addEventListener('focus',doSearch);
$('#q').addEventListener('keydown',e=>{if(e.key=='Enter')document.querySelector('#qr .si[data-sgo]')?.click();if(e.key=='Escape'){e.target.value='';$('#qr').classList.add('hidden')}});
$('#qb').onclick=()=>{$('#q').focus();doSearch()};
document.addEventListener('click',e=>{const s=e.target.closest('.si[data-sgo]');if(s){location.hash=s.dataset.sgo;$('#q').value='';$('#qr').classList.add('hidden')}else if(!e.target.closest('#sbox'))$('#qr').classList.add('hidden')});
const DIST=['Ampara','Anuradhapura','Badulla','Batticaloa','Colombo','Galle','Gampaha','Hambantota','Jaffna','Kalutara','Kandy','Kegalle','Kilinochchi','Kurunegala','Mannar','Matale','Matara','Monaragala','Mullaitivu','Nuwara Eliya','Polonnaruwa','Puttalam','Ratnapura','Trincomalee','Vavuniya'];
function openDr(d){const v=k=>E(d?.[k]||''),m=document.createElement('div'),x=()=>{m.remove();removeEventListener('keydown',esc)},esc=e=>e.key=='Escape'&&x();m.className='mo';
m.innerHTML=`<div class="mb"><h3>${d?'Edit driver':'Driver details'}</h3><div class="fg"><label><span>First name <i>*</i></span><input id="f_firstName" value="${v('firstName')}"></label><label>Last name<input id="f_lastName" value="${v('lastName')}"></label><label><span>Phone number <i>*</i></span><input id="f_phone" type="tel" value="${v('phone')}"></label><label>Email<input id="f_email" type="email" value="${v('email')}"></label><label>NIC No<input id="f_nic" value="${v('nic')}"></label><label>Driving licence<input id="f_license" value="${v('license')}"></label><label class="w">Address<input id="f_address" value="${v('address')}"></label><label>City (district)<select id="f_city"><option value="">Select district</option>${DIST.map(c=>`<option ${c==d?.city?'selected':''}>${c}</option>`).join('')}</select></label></div><h3>Availability</h3><div class="seg">${['Available','Unavailable','On trip'].map(s=>`<label class="st${s.replace(' ','')}"><input type="radio" name="f_status" value="${s}" ${(d?.status||'Available')==s?'checked':''}><span>${s}</span></label>`).join('')}</div><p id="merr"></p><div class="ac"><button class="btn o" id="mc">Cancel</button><button class="btn" id="ms">${d?'Save changes':'Save driver'}</button></div></div>`;
document.body.appendChild(m);addEventListener('keydown',esc);const g=id=>m.querySelector('#f_'+id).value.trim();
m.onclick=e=>{if(e.target==m||e.target.id=='mc')x()};
m.querySelector('#ms').onclick=async()=>{const b={firstName:g('firstName'),lastName:g('lastName'),phone:g('phone'),email:g('email'),nic:g('nic'),license:g('license'),address:g('address'),city:g('city'),status:m.querySelector('[name=f_status]:checked').value};
if(!b.firstName||!b.phone)return m.querySelector('#merr').textContent='First name and phone number are required.';
try{await api(d?'/drivers/'+d.id:'/drivers',{method:d?'PATCH':'POST',body:JSON.stringify(b)});x();load()}catch(e){m.querySelector('#merr').textContent=e.message}};
m.querySelector('#f_firstName').focus()}
const patch=(id,body)=>api('/bookings/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(body)}).then(load).catch(e=>alert(e.message));
document.addEventListener('click',e=>{const t=e.target;
if(t.dataset.acc)return patch(t.dataset.acc,{status:'Accepted',driver:$('#dr').value,vehicle:$('#ve').value});
if(t.dataset.dec){const r=prompt('Reason for declining?');return r&&patch(t.dataset.dec,{status:'Rejected',reason:r})}
if(t.id=='addDr')return openDr();
if(t.dataset.edd)return openDr(DR.find(x=>x.id==t.dataset.edd));
if(t.dataset.st)return api('/drivers/'+t.dataset.id,{method:'PATCH',body:JSON.stringify({status:t.dataset.st})}).then(load).catch(e=>alert(e.message));
if(t.dataset.rmd)return confirm('Remove this driver?')&&api('/drivers/'+t.dataset.rmd,{method:'DELETE'}).then(load).catch(e=>alert(e.message));
if(t.id=='addVe'){const n=$('#vn').value.trim();return n?api('/fleet',{method:'POST',body:JSON.stringify({name:n,type:$('#vt').value,plate:$('#vp').value})}).then(load).catch(e=>alert(e.message)):alert('Enter a vehicle name')}
if(t.dataset.rmv)return confirm('Remove this vehicle?')&&api('/fleet/'+t.dataset.rmv,{method:'DELETE'}).then(load).catch(e=>alert(e.message));
if(t.dataset.cat){const c=t.dataset.cat,cats={Sedan:true,KDH:true,Hatchback:true,...(CFG.categories||{})};cats[c]=cats[c]===false;return api('/settings',{method:'POST',body:JSON.stringify({categories:cats})}).then(()=>{CFG.categories=cats;route()}).catch(e=>alert(e.message))}
if(t.id=='sv'){document.querySelectorAll('[data-k]').forEach(i=>CFG[i.dataset.k]=i.value);return api('/settings',{method:'POST',body:JSON.stringify(CFG)}).then(()=>alert('Saved')).catch(e=>alert(e.message))}
if(t.id=='ex'){const c=[['ID','Name','Phone','From','To','Pickup','Status'],...BK.map(b=>[b.id,b.name,b.phone,b.pickup,b.dropoff,b.date+' '+b.time,b.status])].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='bookings.csv';a.click();return}
const tr=t.closest('tr[data-go]');if(tr&&!t.closest('button'))location.hash=tr.dataset.go;
else if(t.closest('tr[data-go]')&&t.classList.contains('g'))location.hash=t.closest('tr').dataset.go});
$('#lf').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';try{await signInWithEmailAndPassword(auth,$('#em').value,$('#pw').value)}catch{$('#err').textContent='Invalid email or password.'}};
$('#fp').onclick=async e=>{e.preventDefault();if(!$('#em').value)return $('#err').textContent='Enter your email first.';await sendPasswordResetEmail(auth,$('#em').value).catch(()=>{});$('#err').style.color='#1c7a2f';$('#err').textContent='If the account exists, a reset email was sent.'};
$('#lo').onclick=e=>{e.preventDefault();signOut(auth)};
onAuthStateChanged(auth,u=>{$('#login').classList.toggle('hidden',!!u);document.querySelector('.tsw.fx').classList.toggle('hidden',!!u);$('#shell').classList.toggle('hidden',!u);if(u){STACK=[location.hash||'#dash'];syncBack();$('#un').textContent=u.displayName||u.email;load();route()}});
setInterval(()=>auth.currentUser&&load(),10000);
</script></body></html>
